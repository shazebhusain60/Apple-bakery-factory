<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Apple Bakery Factory</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 18px;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .welcome h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .card,
    .section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h3 {
      color: #666;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .card .number {
      font-size: 30px;
      font-weight: bold;
      color: #111;
    }

    .section {
      margin-top: 25px;
    }

    .section h2 {
      margin-bottom: 20px;
    }

    .low-stock {
      display: flex;
      justify-content: space-between;
      padding: 15px;
      border-bottom: 1px solid #eee;
    }

    .status {
      color: #d97706;
      font-weight: bold;
    }

    label {
      display: block;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
      margin-top: 18px;
    }

    select,
    input,
    textarea {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      background: #1f2937;
      color: white;
      border: none;
      padding: 15px 25px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #dc2626;
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }

      .welcome h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <header>
    🍎 Apple Bakery Factory
  </header>

  <div class="container">

    <div class="welcome">
      <h1>Factory Dashboard</h1>
      <p>Welcome to Apple Bakery Factory Management System</p>
    </div>

    <div class="cards">

      <div class="card">
        <h3>Raw Materials</h3>
        <div class="number" id="rawMaterials">0</div>
      </div>

      <div class="card">
        <h3>Finished Products</h3>
        <div class="number" id="products">0</div>
      </div>

      <div class="card">
        <h3>Low Stock Items</h3>
        <div class="number" id="lowStock">0</div>
      </div>

      <div class="card">
        <h3>Today's Production</h3>
        <div class="number" id="production">0</div>
      </div>

    </div>

    <div class="section">
      <h2>⚠ Low Stock Alert</h2>
      <div id="lowStockList">
        <p>Loading stock information...</p>
      </div>
    </div>

    <div class="section">
      <h2>🏭 Production Entry</h2>

      <label for="productSelect">Finished Product</label>
      <select id="productSelect">
        <option value="">Loading products...</option>
      </select>

      <label for="quantity">Quantity Produced</label>
      <input
        type="number"
        id="quantity"
        placeholder="Enter quantity"
        min="1"
      >

      <label for="notes">Notes</label>
      <textarea
        id="notes"
        placeholder="Optional production notes"
      ></textarea>

      <button id="saveProduction">
        Save Production
      </button>

      <div id="message"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // =========================================
    // SUPABASE CONFIG
    // =========================================

    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_KEY = "YOUR_PUBLISHABLE_OR_ANON_KEY";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // =========================================
    // LOAD FINISHED PRODUCTS
    // =========================================

    async function loadProducts() {

      const productSelect =
        document.getElementById("productSelect");

      const { data, error } = await supabaseClient
        .from("finished_products")
        .select("*")
        .order("name");

      if (error) {
        console.error(error);

        productSelect.innerHTML =
          '<option value="">Error loading products</option>';

        return;
      }

      productSelect.innerHTML =
        '<option value="">Select Product</option>';

      data.forEach(product => {

        const option = document.createElement("option");

        option.value = product.id;

        option.textContent =
          product.name + " (Stock: " +
          (product.stock_quantity || 0) + ")";

        productSelect.appendChild(option);

      });

    }


    // =========================================
    // LOAD DASHBOARD DATA
    // =========================================

    async function loadDashboard() {

      // Finished Products
      const { data: productData, error: productError } =
        await supabaseClient
          .from("finished_products")
          .select("*");

      if (!productError && productData) {

        document.getElementById("products").innerText =
          productData.length;

        // Low stock calculation
        const lowStockProducts =
          productData.filter(product =>
            Number(product.stock_quantity || 0) <=
            Number(product.low_stock_limit || 0)
          );

        document.getElementById("lowStock").innerText =
          lowStockProducts.length;

        const lowStockList =
          document.getElementById("lowStockList");

        if (lowStockProducts.length === 0) {

          lowStockList.innerHTML =
            "<p>All products are sufficiently stocked.</p>";

        } else {

          lowStockList.innerHTML = "";

          lowStockProducts.forEach(product => {

            lowStockList.innerHTML += `
              <div class="low-stock">
                <span>
                  ${product.name}
                  (Stock: ${product.stock_quantity || 0})
                </span>
                <span class="status">LOW STOCK</span>
              </div>
            `;

          });

        }

      }

    }


    // =========================================
    // SAVE PRODUCTION
    // =========================================

    document
      .getElementById("saveProduction")
      .addEventListener("click", async function () {

        const productId =
          document.getElementById("productSelect").value;

        const quantity =
          Number(document.getElementById("quantity").value);

        const notes =
          document.getElementById("notes").value;

        const message =
          document.getElementById("message");

        if (!productId) {

          message.className = "error";
          message.innerText =
            "Please select a product.";

          return;
        }

        if (!quantity || quantity <= 0) {

          message.className = "error";
          message.innerText =
            "Please enter a valid quantity.";

          return;
        }

        const button =
          document.getElementById("saveProduction");

        button.disabled = true;
        button.innerText = "Saving...";

        // Insert production entry
        const { error: productionError } =
          await supabaseClient
            .from("production_entries")
            .insert([
              {
                product_id: Number(productId),
                quantity: quantity,
                notes: notes
              }
            ]);

        if (productionError) {

          console.error(productionError);

          message.className = "error";
          message.innerText =
            "Error: " + productionError.message;

          button.disabled = false;
          button.innerText = "Save Production";

          return;
        }

        // Get current stock
        const { data: product, error: fetchError } =
          await supabaseClient
            .from("finished_products")
            .select("stock_quantity")
            .eq("id", productId)
            .single();

        if (!fetchError && product) {

          const newStock =
            Number(product.stock_quantity || 0) + quantity;

          await supabaseClient
            .from("finished_products")
            .update({
              stock_quantity: newStock
            })
            .eq("id", productId);

        }

        message.className = "success";
        message.innerText =
          "✓ Production saved successfully!";

        document.getElementById("quantity").value = "";
        document.getElementById("notes").value = "";

        button.disabled = false;
        button.innerText = "Save Production";

        await loadProducts();
        await loadDashboard();

      });


    // =========================================
    // START APP
    // =========================================

    loadProducts();
    loadDashboard();

  </script>

</body>
</html>
