<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Bakery Factory</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 18px;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .welcome h1 {
      margin-bottom: 8px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .card,
    .section {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .card h3 {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .number {
      font-size: 30px;
      font-weight: bold;
    }

    .section {
      margin-top: 25px;
    }

    .section h2 {
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: none;
      padding: 13px 18px;
      border-radius: 8px;
      background: #1f2937;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .success {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #dcfce7;
      color: #166534;
      border-radius: 8px;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #fee2e2;
      color: #b91c1c;
      border-radius: 8px;
    }

    .low-stock-item,
    .history-item {
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .low-stock-item:last-child,
    .history-item:last-child {
      border-bottom: none;
    }

    .status {
      color: #d97706;
      font-weight: bold;
    }

    .empty {
      color: #666;
      padding: 15px 0;
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .history-name {
      font-weight: bold;
    }

    .history-date {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>🍎 Apple Bakery Factory</header>

  <div class="container">

    <div class="welcome">
      <h1>Factory Dashboard</h1>
      <p>Apple Bakery Factory Management System</p>
    </div>

    <!-- DASHBOARD -->
    <div class="cards">

      <div class="card">
        <h3>Raw Materials</h3>
        <div class="number" id="rawMaterials">0</div>
      </div>

      <div class="card">
        <h3>Finished Products</h3>
        <div class="number" id="products">0</div>
      </div>

      <div class="card">
        <h3>Low Stock Items</h3>
        <div class="number" id="lowStock">0</div>
      </div>

      <div class="card">
        <h3>Today's Production</h3>
        <div class="number" id="todayProduction">0</div>
      </div>

    </div>


    <!-- PRODUCTION ENTRY -->
    <div class="section">

      <h2>🏭 Production Entry</h2>

      <form id="productionForm">

        <div class="form-grid">

          <div class="form-group">
            <label for="productSelect">Finished Product</label>

            <select id="productSelect" required>
              <option value="">Loading products...</option>
            </select>
          </div>

          <div class="form-group">
            <label for="quantityProduced">Quantity Produced</label>

            <input
              type="number"
              id="quantityProduced"
              min="0.01"
              step="0.01"
              placeholder="Enter quantity"
              required
            >
          </div>

          <div class="form-group full">
            <label for="productionNotes">Notes</label>

            <textarea
              id="productionNotes"
              placeholder="Optional production notes"
            ></textarea>
          </div>

        </div>

        <button type="submit" id="productionButton">
          Save Production
        </button>

      </form>

      <div class="success" id="successMessage"></div>
      <div class="error" id="errorMessage"></div>

    </div>


    <!-- LOW STOCK -->
    <div class="section">

      <h2>⚠ Low Stock Alert</h2>

      <div id="lowStockList">
        <div class="empty">Loading...</div>
      </div>

    </div>


    <!-- PRODUCTION HISTORY -->
    <div class="section">

      <h2>📋 Recent Production</h2>

      <div id="productionHistory">
        <div class="empty">Loading...</div>
      </div>

    </div>

  </div>


  <script>

    // =====================================
    // SUPABASE
    // =====================================

    const SUPABASE_URL =
      "https://scceqorbmlugvywaqyjj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_FqRzhKZnyU5HkPoPJFaTEA_omVkwpOV";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // =====================================
    // LOAD ALL PRODUCTS
    // =====================================

    async function loadProducts() {

      const select =
        document.getElementById("productSelect");

      const { data, error } =
        await supabaseClient
          .from("products")
          .select("id, name, current_stock, unit")
          .order("name");

      if (error) {
        console.error(error);

        select.innerHTML =
          `<option value="">Unable to load products</option>`;

        return;
      }

      select.innerHTML =
        `<option value="">Select Product</option>`;

      data.forEach(product => {

        select.innerHTML += `
          <option value="${product.id}">
            ${product.name}
            (Stock: ${product.current_stock || 0} ${product.unit || "pcs"})
          </option>
        `;

      });

    }


    // =====================================
    // LOAD DASHBOARD
    // =====================================

    async function loadDashboard() {

      // RAW MATERIALS
      const { data: rawMaterials, error: rawError } =
        await supabaseClient
          .from("raw_materials")
          .select("id, name, current_stock, minimum_stock, unit");

      if (!rawError && rawMaterials) {

        document.getElementById("rawMaterials").innerText =
          rawMaterials.length;

        const lowItems =
          rawMaterials.filter(item =>
            Number(item.current_stock || 0) <=
            Number(item.minimum_stock || 0)
          );

        document.getElementById("lowStock").innerText =
          lowItems.length;

        const list =
          document.getElementById("lowStockList");

        if (lowItems.length === 0) {

          list.innerHTML =
            `<div class="empty">✓ No low stock items.</div>`;

        } else {

          list.innerHTML = "";

          lowItems.forEach(item => {

            list.innerHTML += `
              <div class="low-stock-item">
                <strong>${item.name}</strong><br>
                Current: ${item.current_stock || 0} ${item.unit || ""}
                |
                Minimum: ${item.minimum_stock || 0} ${item.unit || ""}
                <br>
                <span class="status">LOW STOCK</span>
              </div>
            `;

          });

        }

      }


      // PRODUCTS COUNT
      const { count: productCount, error: productError } =
        await supabaseClient
          .from("products")
          .select("*", {
            count: "exact",
            head: true
          });

      if (!productError) {

        document.getElementById("products").innerText =
          productCount || 0;

      }


      // TODAY'S PRODUCTION
      const today =
        new Date().toISOString().split("T")[0];

      const { data: productionData, error: productionError } =
        await supabaseClient
          .from("production_entries")
          .select("quantity_produced, production_date")
          .gte("production_date", today + "T00:00:00")
          .lte("production_date", today + "T23:59:59.999");

      if (!productionError && productionData) {

        const total =
          productionData.reduce(
            (sum, item) =>
              sum + Number(item.quantity_produced || 0),
            0
          );

        document.getElementById("todayProduction").innerText =
          total;

      }

    }


    // =====================================
    // LOAD PRODUCTION HISTORY
    // =====================================

    async function loadProductionHistory() {

      const history =
        document.getElementById("productionHistory");

      const { data, error } =
        await supabaseClient
          .from("production_entries")
          .select(`
            id,
            quantity_produced,
            production_date,
            notes,
            products (
              name,
              unit
            )
          `)
          .order("production_date", {
            ascending: false
          })
          .limit(10);

      if (error) {

        console.error(error);

        history.innerHTML =
          `<div class="empty">Unable to load production history.</div>`;

        return;
      }

      if (!data || data.length === 0) {

        history.innerHTML =
          `<div class="empty">No production records yet.</div>`;

        return;
      }

      history.innerHTML = "";

      data.forEach(entry => {

        const date =
          entry.production_date
            ? new Date(entry.production_date).toLocaleString()
            : "";

        const productName =
          entry.products?.name || "Unknown Product";

        const unit =
          entry.products?.unit || "";

        history.innerHTML += `
          <div class="history-item">

            <div class="history-top">
              <div class="history-name">
                ${productName}
              </div>

              <strong>
                ${entry.quantity_produced} ${unit}
              </strong>
            </div>

            <div class="history-date">
              ${date}
            </div>

            ${entry.notes
              ? `<div class="history-date">${entry.notes}</div>`
              : ""
            }

          </div>
        `;

      });

    }


    // =====================================
    // SAVE PRODUCTION ENTRY
    // =====================================

    document
      .getElementById("productionForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const productId =
          document.getElementById("productSelect").value;

        const quantity =
          document.getElementById("quantityProduced").value;

        const notes =
          document.getElementById("productionNotes").value.trim();

        const successBox =
          document.getElementById("successMessage");

        const errorBox =
          document.getElementById("errorMessage");

        const button =
          document.getElementById("productionButton");


        successBox.style.display = "none";
        errorBox.style.display = "none";

        button.disabled = true;
        button.innerText = "Saving...";


        const { error } =
          await supabaseClient
            .from("production_entries")
            .insert([
              {
                product_id: Number(productId),
                quantity_produced: Number(quantity),
                notes: notes
              }
            ]);


        button.disabled = false;
        button.innerText = "Save Production";


        if (error) {

          console.error(error);

          errorBox.innerText =
            error.message;

          errorBox.style.display = "block";

          return;

        }


        successBox.innerText =
          "Production saved successfully! Stock has been updated automatically.";

        successBox.style.display = "block";


        // RESET FORM
        document.getElementById(
          "productionForm"
        ).reset();


        // REFRESH ALL DATA
        await loadProducts();
        await loadDashboard();
        await loadProductionHistory();

      });


    // =====================================
    // START APP
    // =====================================

    async function startApp() {

      await loadProducts();
      await loadDashboard();
      await loadProductionHistory();

    }

    startApp();

  </script>

</body>
</html>
